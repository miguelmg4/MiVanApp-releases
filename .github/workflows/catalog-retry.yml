name: Reintentar supermercados

# Si en la última sincronización algún supermercado falló (su catálogo quedó «stale»), lo vuelve a
# intentar cada día, solo ese supermercado. Si todos están al día no descarga nada y acaba en
# segundos. No avisa por correo: el aviso ya llegó con la ejecución del lunes, y si el problema
# sigue, el lunes siguiente volverá a avisar.
on:
  schedule:
    - cron: "0 6 * * 0,2-6" # cada día salvo el lunes, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python3 -m unittest discover -s tests -t .
        working-directory: catalog-sync

      - name: Traer el catálogo publicado
        uses: actions/checkout@v4
        with:
          ref: catalog
          path: out

      - name: Reintentar los supermercados sin actualizar
        run: python3 run.py --out ../out --stale-only
        working-directory: catalog-sync

      - name: Publicar
        working-directory: out
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
            exit 0
          fi
          # Un único commit que se reemplaza cada semana: el repositorio no crece.
          git -c user.name="catalog-sync" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --amend -m "Catálogos $(date -u +%Y-%m-%d)"
          git push --quiet --force origin HEAD:catalog
          echo "Publicado: $(python3 -c 'import json;d=json.load(open("index.json"));print({k:(v["count"],v["stale"]) for k,v in d["stores"].items()})')"
